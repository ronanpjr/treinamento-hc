<body>
    @if (notificationVisible()) {
        <div
            class="app-notification"
            role="status"
            aria-live="polite"
            [class.success]="notificationType() === 'success'"
            [class.error]="notificationType() === 'error'"
        >
            {{ notificationText() }}
        </div>
    }
    <header>
        <h1>Contact List</h1>
    </header>
    <router-outlet></router-outlet>
    <footer>    
        <p>Made artisanally by Elogroupers!</p>
    </footer>
</body>
