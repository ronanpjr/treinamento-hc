#version: '3.9'

services:

  # --------------- BANCO DE DADOS ---------------
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: agenda_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agenda_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------- BACKEND ---------------
  backend:
    build:
      context: ./backend
      dockerfile: backend/Dockerfile
    container_name: backend_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=agenda_db;Username=postgres;Password=senha123
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  # --------------- FRONTEND ---------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_app
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  postgres_data:
